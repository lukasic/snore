secret_key: "change-me-use-a-long-random-string"

redis:
  url: "redis://localhost:6379"

users:
  - username: admin
    # Generate a hash: make hash PW=yourpassword
    password_hash: "$2b$12$SZp37jd6OyhDdvNWfj7TceS8PxdIaxHn/0BQ6MFOYwRPcLxFG7cyi"  # hash of "admin" - change in production!
    queues: []
    notifications: []

  - username: alice
    password_hash: "$2b$12$SZp37jd6OyhDdvNWfj7TceS8PxdIaxHn/0BQ6MFOYwRPcLxFG7cyi"  # hash of "admin" - change in production!
    queues:
      - general
    notifications:
      - type: pushover
        user_key: "your-pushover-user-key"
        api_token: "your-pushover-api-token"
        priority: 1  # optional, default 1
        sound: "pushover"  # optional, default "pushover"
        retry: 60  # optional, only used when priority is 2, default 60
        expire: 1800  # optional, only used when priority is 2, default 1800
      - type: pagerduty
        integration_key: "your-pagerduty-integration-key"

queues:
  - name: general
    flush_after_minutes: 5
    routing_rules: []

  - name: windows
    flush_after_minutes: 10
    routing_rules:
      - match_host: "win-*"
      - match_service: "IIS*"

  - name: icinga-prod
    flush_after_minutes: 5
    routing_rules:
      - match_source: "icinga2.prod"

notifications:
  slack_webhook: ""  # "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"

# Optional SSO login via an OIDC provider (e.g. Keycloak), as an alternative
# to the password login above. Users authenticated via SSO are mapped to the
# `users` list above by username (see oidc.username_claim); an SSO user with
# no matching entry can still log in but will have no queues/notifications.
oidc:
  enabled: false
  issuer: "https://keycloak.example.com/realms/snore"
  client_id: "snore-frontend"
  username_claim: "preferred_username"  # optional, default shown
